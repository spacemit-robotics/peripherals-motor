module: components/peripherals/motor

tests:
  - name: motor-functional
    description: Runs offline motor API and protocol tests, then checks invalid bus-test inputs.
    category: functional
    scopes: [pr]
    timeout_s: 600
    workdir: sdk
    command: |
      set -eu
      SROBOTIS_CMAKE_EXTRA_ARGS="-DSROBOTIS_PERIPHERALS_MOTOR_ENABLED_DRIVERS=drv_can_dm;drv_can_encos;drv_can_agibot;drv_uart_xl330;drv_uart_feetech;drv_ethercat_jmc;drv_canopen_jmc" \
        ./build/build.sh --log=verbose package components/peripherals/motor
      test_motor_core
      test_damiao_protocol
      test_encos_protocol
      test_encos_write_errors
      test_agibot_protocol
      bash components/peripherals/motor/tests/test_functional.sh
  - name: motor-manual
    description: Manual verification confirms that the motors can be controlled.
    category: functional
    scopes: [manual]
    timeout_s: 600
    workdir: sdk
    command: |
      : "${MOTOR_TEST_DRIVER:?Set MOTOR_TEST_DRIVER to select a supported driver}"
      bash components/peripherals/motor/tests/test_manual.sh --driver "$MOTOR_TEST_DRIVER"
